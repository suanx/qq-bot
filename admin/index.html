<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QQ 机器人管理后台</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e3e6ec;
    --text: #1f2430; --muted: #6b7280; --brand: #2563eb;
    --brand-soft: #eaf1ff; --ok: #16a34a; --danger: #dc2626;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--border);
    background: #fff; color: var(--text); border-radius: 6px; padding: 6px 12px;
  }
  button:hover { background: #f3f4f6; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button.danger { color: var(--danger); border-color: #f3c6c6; }
  button.danger:hover { background: #fdf2f2; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, select, textarea {
    font: inherit; padding: 6px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: #fff; color: var(--text); width: 100%;
  }
  table { border-collapse: collapse; width: 100%; background: var(--panel); }
  th, td { border-bottom: 1px solid var(--border); padding: 10px 12px; text-align: left; vertical-align: middle; }
  th { background: #fafbfc; font-weight: 600; color: var(--muted); font-size: 12px; }
  tbody tr:hover { background: #fafbff; }

  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .boot-loading {
    min-height: 60vh; display: grid; place-items: center;
    color: var(--muted); font-size: 14px;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }

  /* ---- 抽屉式侧边栏布局 ---- */
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px; flex-shrink: 0; height: 100vh; position: sticky; top: 0;
    background: #1b2233; color: #cbd5e1; display: flex; flex-direction: column;
    transition: width .22s ease; overflow: hidden; z-index: 60;
  }
  .sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px; color: #fff; }
  .sidebar .brand .logo { width: 32px; height: 32px; flex-shrink: 0; display: grid; place-items: center; background: var(--brand); border-radius: 8px; }
  .sidebar .brand .logo svg { width: 18px; height: 18px; }
  .sidebar .brand .name { font-size: 15px; font-weight: 600; white-space: nowrap; line-height: 1.25; transition: opacity .15s; }
  .sidebar .brand .name small { display: block; font-size: 11px; font-weight: 400; color: #94a3b8; }
  .side-nav { flex: 1; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; overflow-x: hidden; }
  .side-nav button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: transparent; border: 0; color: #cbd5e1; border-radius: 8px;
    padding: 10px 12px; text-align: left; font-size: 14px; white-space: nowrap;
  }
  .side-nav button svg { width: 18px; height: 18px; flex-shrink: 0; }
  .side-nav button:hover { background: rgba(255,255,255,.08); color: #fff; }
  .side-nav button.active { background: var(--brand); color: #fff; font-weight: 600; }
  .side-nav button .lbl { opacity: 1; transition: opacity .15s; }
  .side-foot { padding: 10px; border-top: 1px solid rgba(255,255,255,.08); }
  .side-foot button {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: transparent; border: 0; color: #94a3b8; padding: 8px 12px; border-radius: 8px;
  }
  .side-foot button:hover { background: rgba(255,255,255,.08); color: #fff; }
  .side-foot button svg { width: 16px; height: 16px; flex-shrink: 0; }
  .side-foot .foot-text { white-space: nowrap; opacity: 1; transition: opacity .15s; font-size: 13px; }

  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; position: sticky; top: 0; z-index: 40; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #menuBtn { display: none; }
  .spacer { flex: 1; }
  .who { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: var(--brand-soft); color: var(--brand); }
  main { padding: 20px 24px 48px; }

  /* 桌面端收起态：仅显示图标 */
  @media (min-width: 901px) {
    .sidebar.collapsed { width: 64px; }
    .sidebar.collapsed .brand .name,
    .sidebar.collapsed .side-nav button .lbl,
    .sidebar.collapsed .side-foot .foot-text { opacity: 0; pointer-events: none; }
  }
  /* 移动端：侧边栏变为覆盖式抽屉 */
  .side-mask { position: fixed; inset: 0; background: rgba(16,24,40,.45); z-index: 55; }
  @media (max-width: 900px) {
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; transform: translateX(-100%); transition: transform .22s ease; }
    .sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,.25); }
    #menuBtn { display: inline-flex; }
    #collapseBtn { display: none; }
    header { padding: 12px 14px; }
    main { padding: 16px 14px 40px; }
    /* 修复手机端：表格改为横向滑动而不是被截断/挤压 */
    .panel { overflow: visible; }
    .panel .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .panel table { min-width: 640px; }
    .toolbar input { width: 100%; flex: 1 1 160px; }
    .pager { flex-wrap: wrap; }
    /* 触屏提示：长按单元格可看完整内容（title 悬浮在触屏无效，改为点击弹详情） */
    .panel td[data-full] { cursor: pointer; }
    /* 防 iOS 聚焦自动放大导致页面错位：触屏下控件字号一律 16px */
    input, select, textarea { font-size: 16px; }
  }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); }
  .card .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .card .value { font-size: 24px; font-weight: 650; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
  .panel > .head { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .toolbar { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .toolbar input { width: 260px; }
  .toolbar select { width: auto; min-width: 150px; }
  .pager { display: flex; gap: 10px; align-items: center; padding: 12px 16px; }
  .pager select { width: auto; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  .msg { padding: 10px 16px; }
  .msg.error { background: #fdf2f2; color: var(--danger); }
  .msg.ok { background: #f0fdf4; color: var(--ok); }
  .hint { color: var(--muted); font-size: 12px; }

  .bars { padding: 16px; display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 150px 1fr 56px; gap: 10px; align-items: center; }
  .bar-track { background: #f0f2f5; border-radius: 6px; height: 10px; overflow: hidden; }
  .bar-fill { background: var(--brand); height: 100%; }
  .bar-num { text-align: right; color: var(--muted); font-size: 12px; }

  .mask { position: fixed; inset: 0; background: rgba(16,24,40,.45); display: grid; place-items: center; padding: 24px; z-index: 50; overflow-y: auto; }
  /* 自适应弹窗：永不超出视口，超长内容在弹窗内部滚动，底部按钮始终可见 */
  .modal { background: var(--panel); border-radius: 12px; width: 460px; max-width: 100%; max-height: calc(100vh - 48px); display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .modal .head { padding: 16px 20px; border-bottom: 1px solid var(--border); font-weight: 600; flex-shrink: 0; }
  .modal .body { padding: 18px 20px; display: grid; gap: 14px; flex: 1 1 auto; min-height: 0; overflow: auto; }
  .modal .foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-shrink: 0; }
  .modal input, .modal select, .modal textarea { width: 100%; box-sizing: border-box; }

  /* 轻提示（替代 alert，手机上不会被系统弹窗挡住） */
  .toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #1b2233; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px;
    box-shadow: 0 4px 14px rgba(16,24,40,.25); z-index: 70; max-width: calc(100vw - 40px); text-align: center;
    animation: toast-in .18s ease; }
  .toast.err { background: #b91c1c; }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @media (max-width: 900px) {
    .mask { padding: 10px; }
    .modal { width: 100%; max-height: calc(100vh - 20px); border-radius: 10px; }
    .modal .head { padding: 12px 14px; }
    .modal .body { padding: 14px; gap: 12px; }
    .modal .foot { padding: 12px 14px; }
    /* 触屏可用性：控件 16px 防 iOS 聚焦放大，按钮加大并平分宽度 */
    .modal input, .modal select, .modal textarea { font-size: 16px; }
    .modal .foot .spacer { display: none; }
    .modal .foot button { flex: 1; padding: 11px 0; font-size: 15px; }
  }
</style>
</head>
<body>

<!-- 会话验证期间显示，验证通过后移除 -->
<div id="bootLoading" class="boot-loading">正在验证登录状态…</div>

<!-- ============ 主应用（未登录由下方守卫脚本跳转登录页） ============ -->
<div id="appView" hidden>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V5.5"/><circle cx="12" cy="4" r="1.5"/><circle cx="9" cy="13" r="1" fill="#fff" stroke="none"/><circle cx="15" cy="13" r="1" fill="#fff" stroke="none"/><path d="M9.5 16.5h5"/></svg></span>
        <span class="name">QQ 机器人<small>管理后台</small></span>
      </div>
      <nav class="side-nav" id="tabs"></nav>
      <div class="side-foot">
        <button id="collapseBtn" title="收起/展开侧边栏">
          <svg id="collapseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5"/><path d="M18 17l-5-5 5-5"/></svg>
          <span class="foot-text">收起侧边栏</span>
        </button>
      </div>
    </aside>
    <div class="side-mask" id="sideMask" hidden></div>
    <div class="content">
      <header>
        <button id="menuBtn" title="打开菜单">☰</button>
        <h1 id="pageTitle">数据概览</h1>
        <span id="storageBadge" class="badge"></span>
        <span class="spacer"></span>
        <span class="who" id="who"></span>
        <button id="logoutBtn">退出</button>
      </header>
      <main>
        <section id="view-overview" class="view" hidden></section>
        <section id="view-groups" class="view" hidden></section>
        <section id="view-members" class="view" hidden></section>
        <section id="view-violations" class="view" hidden></section>
        <section id="view-rules" class="view" hidden></section>
        <section id="view-settings" class="view" hidden></section>
        <section id="view-joinrequests" class="view" hidden></section>
        <section id="view-admins" class="view" hidden></section>
        <section id="view-logs" class="view" hidden></section>
      </main>
    </div>
  </div>
</div>

<script>
/* ================= 工具 ================= */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
}[c]));

function fmtTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const bj = new Date(d.getTime() + 8 * 3600 * 1000);
  const p2 = (n) => String(n).padStart(2, '0');
  return bj.getUTCFullYear() + '-' + p2(bj.getUTCMonth() + 1) + '-' + p2(bj.getUTCDate())
    + ' ' + p2(bj.getUTCHours()) + ':' + p2(bj.getUTCMinutes());
}
function short(s) { const t = String(s || ''); return t.length > 10 ? t.slice(0, 8) + '…' : t; }

/** 轻提示：2.6 秒自动消失；isErr=true 显示红色错误样式 */
function toast(msg, isErr = false) {
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts,
  });
  let data = {};
  try { data = await res.json(); } catch { /* 空响应 */ }
  // 会话失效：除启动探测 /me 外，任何接口 401 都跳回登录页
  if (res.status === 401 && !path.startsWith('/api/admin/me')) {
    location.replace('./login.html?reason=expired');
    throw new Error('登录已过期');
  }
  return { res, data };
}

/* ================= 视图定义 ================= */
/* 菜单图标（feather 风格描边 SVG，随主题色） */
const ICONS = {
  overview: '<path d="M3 21h18"/><path d="M6 21v-8"/><path d="M12 21V5"/><path d="M18 21v-5"/>',
  groups: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
  members: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  violations: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  rules: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  admins: '<path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>',
  logs: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  settings: '<path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/><circle cx="9" cy="5" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="19" r="2"/>',
  joinrequests: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/>',
};
const svgIcon = (key) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + (ICONS[key] || '') + '</svg>';

const VIEWS = [
  { key: 'overview', label: '数据概览' },
  { key: 'groups', label: '群管理' },
  { key: 'members', label: '成员管理' },
  { key: 'violations', label: '违规记录' },
  { key: 'rules', label: '广告规则' },
  { key: 'settings', label: '群设置' },
  { key: 'joinrequests', label: '入群申请' },
  { key: 'admins', label: '管理员与权限' },
  { key: 'logs', label: '操作日志' },
];

const SCHEMA = {
  groups: {
    title: '群管理',
    allowClientId: true,
    placeholder: '搜索群 openid / 名称',
    columns: ['id', 'name', 'status', 'aiEnabled', 'adFilterEnabled', 'lastActiveAt'],
    filters: ['status'],
    fields: [
      { key: 'id', label: '群 openid', type: 'text', primary: true, required: true },
      { key: 'name', label: '群名称', type: 'text', required: true },
      { key: 'status', label: '状态', type: 'select', options: ['active', 'disabled'] },
      { key: 'aiEnabled', label: 'AI 对话', type: 'bool' },
      { key: 'adFilterEnabled', label: '广告过滤', type: 'bool' },
      { key: 'memberCount', label: '成员数', type: 'number' },
      { key: 'memberWelcome', label: '专属欢迎词（留空则用全局）', type: 'textarea' },
      { key: 'leaveNotice', label: '专属退群提示（留空则用全局）', type: 'textarea' },
    ],
  },
  members: {
    title: '成员管理',
    allowClientId: true,
    placeholder: '搜索成员 openid / 昵称 / 群',
    columns: ['memberOpenid', 'nickname', 'groupOpenid', 'violations', 'status', 'mutedUntil', 'lastActiveAt'],
    filters: ['groupOpenid', 'status'],
    fields: [
      { key: 'id', label: '记录 ID（群:成员）', type: 'text', primary: true, required: true },
      { key: 'groupOpenid', label: '群 openid', type: 'text', required: true },
      { key: 'memberOpenid', label: '成员 openid', type: 'text', required: true },
      { key: 'nickname', label: '昵称', type: 'text' },
      { key: 'violations', label: '违规次数', type: 'number' },
      {
        key: 'status',
        label: '状态',
        type: 'select',
        options: ['normal', 'muted', 'blacklisted', 'kicked'],
      },
      { key: 'mutedUntil', label: '禁言到期(ISO)', type: 'text' },
    ],
  },
  violations: {
    title: '违规记录',
    placeholder: '搜索成员 openid / 规则 / 命中内容',
    columns: ['createdAt', 'groupOpenid', 'memberOpenid', 'rule', 'matched', 'action', 'count'],
    filters: ['groupOpenid', 'rule', 'action'],
    fields: [
      { key: 'groupOpenid', label: '群 openid', type: 'text' },
      { key: 'memberOpenid', label: '成员 openid', type: 'text' },
      { key: 'rule', label: '命中规则', type: 'text' },
      { key: 'matched', label: '命中内容', type: 'text' },
      { key: 'action', label: '处置', type: 'select', options: ['warn', 'delete', 'delete_mute'] },
      { key: 'muteSeconds', label: '禁言秒数', type: 'number' },
      { key: 'count', label: '第几次', type: 'number' },
      { key: 'content', label: '原文', type: 'textarea' },
    ],
  },
  rules: {
    title: '广告规则',
    placeholder: '搜索关键词 / 正则 / 备注',
    columns: ['type', 'value', 'rule', 'note', 'enabled', 'createdAt'],
    filters: ['type', 'enabled'],
    fields: [
      { key: 'type', label: '类型', type: 'select', options: ['keyword', 'regex'], required: true },
      { key: 'value', label: '规则内容', type: 'text', required: true },
      { key: 'rule', label: '归属规则名', type: 'text' },
      { key: 'note', label: '备注', type: 'text' },
      { key: 'enabled', label: '启用', type: 'bool' },
    ],
  },
  admins: {
    title: '管理员与权限',
    placeholder: '搜索 openid / 名称 / 备注',
    columns: ['openid', 'name', 'role', 'status', 'note', 'createdAt'],
    filters: ['role', 'status'],
    fields: [
      { key: 'openid', label: 'QQ openid', type: 'text', primary: true, required: true },
      { key: 'name', label: '名称', type: 'text' },
      { key: 'role', label: '角色', type: 'select', options: ['owner', 'admin', 'viewer'], required: true },
      { key: 'status', label: '状态', type: 'select', options: ['enabled', 'disabled'], required: true },
      { key: 'note', label: '备注', type: 'text' },
    ],
  },
  logs: {
    title: '操作日志',
    placeholder: '搜索操作人 / 动作 / 目标',
    columns: ['createdAt', 'actor', 'actorRole', 'action', 'target', 'detail'],
    filters: ['action'],
    readonly: true,
    fields: [],
  },
};

const state = {};
VIEWS.forEach((v) => {
  if (v.key !== 'overview') {
    state[v.key] = { page: 1, pageSize: 20, search: '', filters: {}, sortKey: 'createdAt', sortDir: 'desc' };
  }
});

let currentUser = null;

/* ================= 视图切换 ================= */
function renderTabs() {
  $('#tabs').innerHTML = VIEWS
    .map((v) => '<button data-view="' + v.key + '" title="' + esc(v.label) + '">'
      + svgIcon(v.key) + '<span class="lbl">' + esc(v.label) + '</span></button>')
    .join('');
  $$('#tabs button').forEach((b) => {
    b.addEventListener('click', () => {
      switchView(b.dataset.view);
      closeDrawer(); // 移动端点选后自动收起抽屉
    });
  });
}

function switchView(key) {
  const view = VIEWS.find((v) => v.key === key);
  $$('.view').forEach((s) => { s.hidden = s.id !== 'view-' + key; });
  $$('#tabs button').forEach((b) => b.classList.toggle('active', b.dataset.view === key));
  const title = view ? view.label : '';
  $('#pageTitle').textContent = title;
  document.title = title + ' · QQ 机器人管理后台';
  if (key === 'overview') renderOverview();
  else if (key === 'settings') renderSettings();
  else if (key === 'joinrequests') renderJoinRequests();
  else renderCollection(key);
}

/* ================= 集合视图 ================= */
async function renderCollection(name) {
  const schema = SCHEMA[name];
  const st = state[name];
  const qs = new URLSearchParams({
    page: String(st.page),
    pageSize: String(st.pageSize),
    sortKey: st.sortKey,
    sortDir: st.sortDir,
  });
  if (st.search) qs.set('search', st.search);
  Object.entries(st.filters).forEach(([k, v]) => { if (v) qs.set(k, v); });

  let d = {};
  try {
    const r = await api('/api/admin/' + name + '?' + qs.toString());
    d = r.data;
  } catch (e) {
    $('#view-' + name).innerHTML = '<div class="panel"><div class="head">' + esc(schema.title)
      + '</div><div class="empty">加载失败：' + esc(e.message) + '</div></div>';
    return;
  }

  const items = d.items || [];
  const total = d.total ?? 0;
  const totalPages = d.totalPages ?? 1;

  const filterSelects = (schema.filters || []).map((key) => `<select data-filter="${key}">
      <option value="">${esc(key)}（全部）</option>
    </select>`).join('');

  const headHtml = (schema.columns || []).map((c) => '<th>' + esc(c) + '</th>').join('');

  const bodyHtml = items.map((it) => '<tr>'
    + (schema.columns || []).map((c) => {
      let v = it[c];
      if (c === 'createdAt' || c === 'lastActiveAt' || c === 'mutedUntil') v = fmtTime(v);
      if (c === 'aiEnabled' || c === 'adFilterEnabled' || c === 'enabled') {
        return '<td>' + (v ? '<span class="pill active">开</span>' : '<span class="pill muted">关</span>') + '</td>';
      }
      if (c === 'status') {
        const ok = v === 'normal' || v === 'active' || v === 'enabled';
        const cls = ok ? 'active' : (v === 'disabled' ? 'disabled' : 'muted');
        return '<td><span class="pill ' + cls + '">' + esc(v ?? '-') + '</span></td>';
      }
      if (c === 'content' || c === 'detail' || c === 'target') {
        const t = String(v ?? '');
        const shown = t.length > 40 ? t.slice(0, 40) + '…' : t;
        if (t.length > 40) {
          // 手机端无法悬浮查看 title，点击弹出全文详情
          return '<td title="' + esc(t) + '" data-full="' + esc(t) + '" class="cell-more">' + (esc(shown) || '-') + '</td>';
        }
        return '<td>' + (esc(shown) || '-') + '</td>';
      }
      return '<td>' + esc(v ?? '-') + '</td>';
    }).join('')
    + '<td style="white-space:nowrap">'
    + (schema.readonly ? '' : '<button data-edit="' + esc(it.id) + '">编辑</button>')
    + '</td></tr>').join('');

  $(`#view-${name}`).innerHTML = `
    <div class="panel">
      <div class="toolbar">
        <input id="q_${name}" placeholder="${esc(schema.placeholder)}" value="${esc(st.search)}">
        ${filterSelects}
        <span class="spacer"></span>
        ${schema.readonly ? '<span class="hint">只读</span>' : '<button class="primary" id="new_' + name + '">+ 新建</button>'}
      </div>
      <div id="msg_${name}"></div>
      ${items.length
    ? '<div class="table-wrap"><table><thead><tr>' + headHtml + '<th>操作</th></tr></thead><tbody>' + bodyHtml + '</tbody></table></div>'
    : '<div class="empty">暂无数据</div>'}
      <div class="pager">
        <button data-page="prev" ${st.page <= 1 ? 'disabled' : ''}>上一页</button>
        <span>第 ${st.page} / ${totalPages} 页 · 共 ${total} 条</span>
        <button data-page="next" ${st.page >= totalPages ? 'disabled' : ''}>下一页</button>
        <select data-pagesize>
          ${[10, 20, 50, 100].map((n) => '<option value="' + n + '"'
            + (st.pageSize === n ? ' selected' : '') + '>' + n + ' 条/页</option>').join('')}
        </select>
      </div>
    </div>`;

  bindCollectionEvents(name, schema, st, totalPages);
}

function bindCollectionEvents(name, schema, st, totalPages) {
  const root = $(`#view-${name}`);

  const input = $('#q_' + name, root);
  if (input) {
    let timer = null;
    input.addEventListener('input', (e) => {
      clearTimeout(timer);
      const val = e.target.value;
      timer = setTimeout(() => { st.search = val; st.page = 1; renderCollection(name); }, 250);
    });
  }

  $$('[data-filter]', root).forEach((sel) => {
    sel.addEventListener('change', (e) => {
      const k = e.target.dataset.filter;
      if (e.target.value) st.filters[k] = e.target.value;
      else delete st.filters[k];
      st.page = 1;
      renderCollection(name);
    });
  });

  $$('[data-page]', root).forEach((b) => {
    b.addEventListener('click', () => {
      if (b.dataset.page === 'prev' && st.page > 1) st.page -= 1;
      if (b.dataset.page === 'next' && st.page < totalPages) st.page += 1;
      renderCollection(name);
    });
  });

  const ps = $('[data-pagesize]', root);
  if (ps) {
    ps.addEventListener('change', (e) => {
      st.pageSize = Number(e.target.value);
      st.page = 1;
      renderCollection(name);
    });
  }

  const nb = $('#new_' + name, root);
  if (nb) nb.addEventListener('click', () => openModal(name, null));

  $$('[data-edit]', root).forEach((b) => {
    b.addEventListener('click', () => openModal(name, b.dataset.edit));
  });

  // 手机端：点击截断单元格弹出全文详情（触屏无 hover title）
  $$('.cell-more', root).forEach((td) => {
    td.addEventListener('click', () => showDetail(td.dataset.full));
  });
}

/** 全文详情弹窗（两端通用） */

/* ================= 弹窗 ================= */
async function openModal(name, id) {
  const schema = SCHEMA[name];
  const isEdit = !!id;
  let item = schema.defaults ? { ...schema.defaults } : {};
  if (isEdit) {
    const r = await api('/api/admin/' + name + '?id=' + encodeURIComponent(id));
    item = (r.data && r.data.item) || item;
  }

  const mask = document.createElement('div');
  mask.className = 'mask';

  const bodyHtml = schema.fields.map((f) => {
    const label = '<label>' + esc(f.label) + (f.required ? ' *' : '') + '</label>';
    const disabled = f.primary && isEdit;
    if (f.type === 'select') {
      const opts = f.options
        .map((o) => '<option value="' + esc(o) + '"'
          + (String(item[f.key] ?? '') === o ? ' selected' : '') + '>' + esc(o) + '</option>')
        .join('');
      return '<div>' + label + '<select data-key="' + f.key + '"'
        + (disabled ? ' disabled' : '') + '>' + opts + '</select></div>';
    }
    if (f.type === 'bool') {
      const on = !!item[f.key];
      return '<div>' + label + '<select data-key="' + f.key + '">'
        + '<option value="true"' + (on ? ' selected' : '') + '>开启</option>'
        + '<option value="false"' + (on ? '' : ' selected') + '>关闭</option>'
        + '</select></div>';
    }
    if (f.type === 'textarea') {
      return '<div>' + label + '<textarea data-key="' + f.key + '">'
        + esc(item[f.key] ?? '') + '</textarea></div>';
    }
    const t = f.type === 'number' ? 'number' : 'text';
    return '<div>' + label + '<input type="' + t + '" data-key="' + f.key
      + '" value="' + esc(item[f.key] ?? '') + '"' + (disabled ? ' disabled' : '') + '></div>';
  }).join('');

  mask.innerHTML = `
    <div class="modal">
      <div class="head">${isEdit ? '编辑' : '新建'} · ${esc(schema.title)}</div>
      <div class="body">${bodyHtml}</div>
      <div class="foot">
        ${isEdit ? '<button class="danger" id="delBtn">删除</button>' : ''}
        <span class="spacer"></span>
        <button id="cancelBtn">取消</button>
        <button class="primary" id="saveBtn">保存</button>
      </div>
    </div>`;
  document.body.appendChild(mask);

  const close = () => mask.remove();
  $('#cancelBtn', mask).addEventListener('click', close);
  mask.addEventListener('click', (e) => { if (e.target === mask) close(); });

  $('#saveBtn', mask).addEventListener('click', async () => {
    const payload = {};
    $$('[data-key]', mask).forEach((el) => {
      if (el.disabled) return;                       // 主键不带出
      let v = el.value;
      if (el.tagName === 'SELECT' && (v === 'true' || v === 'false')) v = v === 'true';
      else if (el.type === 'number') v = v === '' ? 0 : Number(v);
      payload[el.dataset.key] = v;
    });
    try {
      const r = await api('/api/admin/' + name + (isEdit ? '?id=' + encodeURIComponent(id) : ''),
        { method: isEdit ? 'PUT' : 'POST', body: JSON.stringify(payload) });
      if (!r.data.ok) { toast(r.data.error || '保存失败', true); return; }
      close();
      renderCollection(name);
      toast('已保存');
    } catch (e) {
      toast('保存失败：' + e.message, true);
    }
  });

  if (isEdit) {
    $('#delBtn', mask).addEventListener('click', async () => {
      if (!confirm('确认删除该记录？此操作会记入操作日志。')) return;
      try {
        const r = await api('/api/admin/' + name + '?id=' + encodeURIComponent(id), { method: 'DELETE' });
        if (!r.data.ok) { toast(r.data.error || '删除失败', true); return; }
        close();
        renderCollection(name);
        toast('已删除');
      } catch (e) {
        toast('删除失败：' + e.message, true);
      }
    });
  }
}

/* ================= 入群申请 ================= */
const JOIN_STATUS = {
  pending: { label: '待审批', cls: 'muted' },
  approved: { label: '已通过', cls: 'active' },
  declined: { label: '已拒绝', cls: 'disabled' },
};
const JOIN_SOURCE = { self_apply: '主动申请', invited: '被邀请' };

async function renderJoinRequests() {
  const root = $('#view-joinrequests');
  const st = state.joinrequests;
  const qs = new URLSearchParams({ page: st.page, pageSize: st.pageSize });
  if (st.search) qs.set('search', st.search);
  if (st.filters.status) qs.set('status', st.filters.status);

  let d = {};
  try {
    const r = await api('/api/admin/joinrequests?' + qs.toString());
    if (!r.data.ok) throw new Error(r.data.error || '读取失败');
    d = r.data;
  } catch (e) {
    root.innerHTML = '<div class="panel"><div class="head">入群申请</div>'
      + '<div class="empty">加载失败：' + esc(e.message) + '</div></div>';
    return;
  }

  const items = d.items || [];
  const total = d.total ?? 0;
  const totalPages = d.totalPages ?? 1;

  const rows = items.map((it) => {
    const s = JOIN_STATUS[it.status] || { label: it.status || '-', cls: 'muted' };
    const pending = it.status === 'pending';
    return '<tr>'
      + '<td>' + esc(fmtTime(it.applyAt || it.createdAt)) + '</td>'
      + '<td>' + esc(it.username || '-') + '</td>'
      + '<td data-full="' + esc(it.memberOpenid) + '" class="cell-more" title="' + esc(it.memberOpenid) + '">'
      + esc(short(it.memberOpenid)) + '</td>'
      + '<td>' + esc(JOIN_SOURCE[it.applySource] || it.applySource || '-') + '</td>'
      + '<td>' + (it.riskTips ? '<span class="pill disabled">有风险</span>' : '-') + '</td>'
      + '<td><span class="pill ' + s.cls + '">' + esc(s.label) + '</span></td>'
      + '<td>' + esc(it.handledBy || '-') + '</td>'
      + '<td style="white-space:nowrap">'
      + (pending
        ? '<button class="primary" data-approve="' + esc(it.id) + '">通过</button> '
          + '<button data-decline="' + esc(it.id) + '">拒绝</button> '
          + '<button data-decline-black="' + esc(it.id) + '">拒绝+拉黑</button>'
        : '<span class="hint">' + esc(it.reason || '') + '</span>')
      + '</td></tr>';
  }).join('');

  root.innerHTML = `
    <div class="panel">
      <div class="toolbar">
        <input id="q_joinrequests" placeholder="搜索申请人 / openid / 群" value="${esc(st.search)}">
        <select data-jfilter="status">
          <option value="">状态（全部）</option>
          ${Object.entries(JOIN_STATUS).map(([k, v]) => '<option value="' + k + '"'
            + (st.filters.status === k ? ' selected' : '') + '>' + v.label + '</option>').join('')}
        </select>
        <span class="spacer"></span>
        <button id="jrRefresh">刷新</button>
      </div>
      ${items.length
        ? '<div class="table-wrap"><table><thead><tr><th>申请时间</th><th>申请人</th><th>openid</th>'
          + '<th>来源</th><th>风险</th><th>状态</th><th>处理人</th><th>操作</th></tr></thead>'
          + '<tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty">暂无入群申请记录</div>'}
      <div class="pager">
        <button data-jpage="prev" ${st.page <= 1 ? 'disabled' : ''}>上一页</button>
        <span>第 ${st.page} / ${totalPages} 页 · 共 ${total} 条</span>
        <button data-jpage="next" ${st.page >= totalPages ? 'disabled' : ''}>下一页</button>
        <select data-jpagesize>
          ${[10, 20, 50].map((n) => '<option value="' + n + '"'
            + (st.pageSize === n ? ' selected' : '') + '>' + n + ' 条/页</option>').join('')}
        </select>
      </div>
    </div>
    <div class="panel" style="margin-top:18px">
      <div class="head">说明</div>
      <div style="padding:18px;line-height:1.9;font-size:13px;color:var(--muted)">
        <p>· 只有当<b>机器人是群管理员</b>时，平台才会推送入群申请事件 <code>GROUP_JOIN_REQUEST</code>（需在开放平台勾选「入群申请」）。</p>
        <p>· 「拒绝并拉黑」会调用平台审批接口同时写入群黑名单，可真正阻止该账号再次申请；普通「拒绝」仅本次拒绝。</p>
        <p>· 自动策略在「群设置」里配置：黑名单自动拒绝（默认开）、自动通过（默认关）。</p>
      </div>
    </div>`;

  const input = $('#q_joinrequests', root);
  let timer = null;
  input?.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { st.search = input.value.trim(); st.page = 1; renderJoinRequests(); }, 300);
  });

  const sel = $('[data-jfilter="status"]', root);
  sel?.addEventListener('change', () => { st.filters.status = sel.value; st.page = 1; renderJoinRequests(); });

  const sizeSel = $('[data-jpagesize]', root);
  sizeSel?.addEventListener('change', () => { st.pageSize = Number(sizeSel.value); st.page = 1; renderJoinRequests(); });

  $('#jrRefresh', root)?.addEventListener('click', () => renderJoinRequests());

  $$('[data-jpage]', root).forEach((b) => b.addEventListener('click', () => {
    st.page += b.dataset.jpage === 'next' ? 1 : -1;
    if (st.page < 1) st.page = 1;
    renderJoinRequests();
  }));

  const submit = async (id, op, addToBlacklist) => {
    try {
      const r = await api('/api/admin/joinrequests', {
        method: 'POST',
        body: JSON.stringify({ id, op, addToBlacklist }),
      });
      if (!r.data.ok) { toast(r.data.error || '操作失败', true); return; }
      toast(op === 'decline' ? (addToBlacklist ? '已拒绝并拉黑' : '已拒绝') : '已通过');
      renderJoinRequests();
    } catch (e) {
      toast('操作失败：' + e.message, true);
    }
  };

  $$('[data-approve]', root).forEach((b) => b.addEventListener('click', () => {
    submit(b.dataset.approve, 'approve', false);
  }));
  $$('[data-decline]', root).forEach((b) => b.addEventListener('click', () => {
    submit(b.dataset.decline, 'decline', false);
  }));
  $$('[data-decline-black]', root).forEach((b) => b.addEventListener('click', () => {
    submit(b.dataset.declineBlack, 'decline', true);
  }));
}

        options: [['delete_mute', '撤回消息 + 禁言'], ['delete', '仅撤回消息'], ['warn', '仅警告']],
      },
      { key: 'adMuteThreshold', type: 'num', label: '第 N 次违规开始禁言', hint: '留空 = 环境变量默认 3 次' },
      { key: 'adMuteSeconds', type: 'num', label: '首次禁言时长（秒，之后逐次翻倍）', hint: '留空 = 环境变量默认 600 秒（10 分钟）' },
      { key: 'adKickThreshold', type: 'num', label: '第 N 次违规踢出群聊并拉黑（0 = 关闭）', hint: '留空 = 环境变量默认 4 次' },
    ],
  },
  {
    title: '入群申请',
    fields: [
      { key: 'joinRequestEnabled', type: 'bool', label: '处理入群申请（GROUP_JOIN_REQUEST）' },
      { key: 'joinAutoRejectBlacklist', type: 'bool', label: '黑名单申请人自动拒绝并拉黑' },
      { key: 'joinAutoApprove', type: 'bool', label: '入群申请自动通过（风险账号除外）' },
      { key: 'joinNotice', type: 'text', label: '入群申请群内通知（支持 {name} {source} {time} {tips}）' },
      { key: 'joinRejectReason', type: 'text', label: '自动拒绝理由' },
    ],
  },
];

async function renderSettings() {
  const root = $('#view-settings');
  root.innerHTML = '<div class="panel"><div class="head">群设置</div>'
    + '<div style="padding:18px" class="empty">加载中…</div></div>';

  let item = {};
  let effective = {};
  try {
    const r = await api('/api/admin/settings');
    if (!r.data.ok) throw new Error(r.data.error || '读取失败');
    item = r.data.item || {};
    effective = r.data.effective || {};
  } catch (e) {
    root.innerHTML = '<div class="panel"><div class="head">群设置</div>'
      + '<div style="padding:18px" class="empty">读取失败：' + esc(e.message) + '</div></div>';
    return;
  }

  const renderField = (f) => {
    const label = '<label>' + esc(f.label) + '</label>';
    if (f.type === 'bool') {
      const on = item[f.key] !== false && String(item[f.key]) !== 'false';
      return '<div class="field">' + label + '<select data-set="' + f.key + '">'
        + '<option value="true"' + (on ? ' selected' : '') + '>开启</option>'
        + '<option value="false"' + (on ? '' : ' selected') + '>关闭</option>'
        + '</select></div>';
    }
    if (f.type === 'select') {
      const cur = String(item[f.key] ?? '');
      return '<div class="field">' + label + '<select data-set="' + f.key + '">'
        + f.options.map((o) => '<option value="' + o[0] + '"'
          + (cur === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('')
        + '</select></div>';
    }
    if (f.type === 'num') {
      const cur = effective[f.key];
      const tip = (cur !== undefined && cur !== '' && cur !== null)
        ? '<div class="hint" style="margin-top:6px">当前生效：' + esc(String(cur)) + '（环境变量）</div>'
        : '';
      return '<div class="field">' + label
        + '<input type="number" min="0" step="1" data-set="' + f.key + '"'
        + ' value="' + esc(item[f.key] ?? '') + '" placeholder="' + esc(f.hint || '') + '">'
        + tip + '</div>';
    }
    return '<div class="field">' + label
      + '<textarea data-set="' + f.key + '" rows="3" style="resize:vertical"'
      + ' placeholder="留空则使用内置默认文案">' + esc(item[f.key] ?? '') + '</textarea></div>';
  };

  root.innerHTML =
    SETTINGS_SECTIONS.map((sec) =>
      '<div class="panel" style="margin-bottom:18px">'
      + '<div class="head">' + esc(sec.title) + '</div>'
      + '<div style="padding:18px">' + sec.fields.map(renderField).join('')
      + (sec.title.indexOf('违规处置') === 0
        ? '<div style="display:flex;gap:10px;flex-wrap:wrap">'
          + '<button class="primary" id="setSave">保存设置</button>'
          + '<button id="setReset">恢复默认（清空文案与数值）</button>'
          + '</div>'
        : '')
      + '</div></div>').join('')
    + '<div class="panel"><div class="head">说明</div>'
    + '<div style="padding:18px;line-height:1.9;font-size:13px;color:var(--muted)">'
    + '<p>· 文案留空 = 使用内置默认；「群管理」里可给单个群设置专属欢迎词/退群提示，优先于这里。</p>'
    + '<p>· <b>违规阶梯（默认）</b>：第 1–2 次仅警告；第 3 次起撤回并禁言（10 分钟起，逐次翻倍）；第 4 次踢出群聊并拉黑。警告文案为 <code>@昵称 ⚠️ 你发送的内容违反群规（第 N 次），禁言 X 分钟，请遵守群规！</code></p>'
    + '<p>· 踢人接口属平台内邀能力，未开通时踢出会失败并写 <code>kick_failed</code> 日志，机器人会同步写入<b>本地黑名单</b>（其后续发言一律忽略），请管理员手动移出。</p>'
    + '<p>· 新成员进群欢迎依赖平台事件 <code>GROUP_MEMBER_ADD</code>，需在 QQ 开放平台「事件订阅」勾选「群成员加入」；退群提示同理需勾选「群成员退出」。</p>'
    + '<p>· <b>排障技巧</b>：事件一到就会写操作日志（动作 <code>member_join</code> / <code>member_leave</code> / <code>join_request</code>）。如果日志里没有对应记录，说明平台没推送事件（订阅未勾选）；如果有记录但群里没消息，看 <code>send_failed</code> 记录里的平台错误码。</p>'
    + '<p>· 入群申请 <code>GROUP_JOIN_REQUEST</code> 只在<b>机器人是群管理员</b>时才会推送；黑名单申请可在「入群申请」里一键拒绝并写入群黑名单。</p>'
    + '<p>· 群机器人出站消息不支持 @ 第三人，警告文案里的 <code>@昵称</code> 为纯文本（不产生真实提醒），但消息同时是对该成员消息的引用回复。</p>'
    + '</div></div>';

  $('#setSave').addEventListener('click', async () => {
    // 按字段类型分别取值：bool 提交真布尔、num 提交数字字符串（空串=回退环境变量）、枚举/文本提交原文
    const payload = {};
    SETTINGS_SECTIONS.forEach((sec) => sec.fields.forEach((f) => {
      const el = $('[data-set="' + f.key + '"]', root);
      if (!el) return;
      if (f.type === 'bool') payload[f.key] = el.value === 'true';
      else if (f.type === 'num') payload[f.key] = String(el.value || '').trim();
      else payload[f.key] = el.value;
    }));
    try {
      const r = await api('/api/admin/settings', { method: 'PUT', body: JSON.stringify(payload) });
      if (!r.data.ok) { toast(r.data.error || '保存失败', true); return; }
      toast('已保存，立即生效');
    } catch (e) {
      toast('保存失败：' + e.message, true);
    }
  });

  $('#setReset').addEventListener('click', () => {
    $$('textarea[data-set]', root).forEach((el) => { el.value = ''; });
    $$('input[type=number][data-set]', root).forEach((el) => { el.value = ''; });
    toast('已清空文案与数值，记得点「保存设置」');
  });
}

/* ================= 启动（访问守卫） ================= */
/* 管理页只对已登录会话开放：/api/admin/me 未通过则强制跳转登录页 */
async function boot() {
  try {
    const { data } = await api('/api/admin/me');
    if (data && data.ok) {
      currentUser = data;
      $('#who').textContent = data.username + '（' + data.role + '）';
      $('#bootLoading')?.remove();
      $('#appView').hidden = false;
      renderTabs();
      switchView('overview');
      return;
    }
  } catch { /* 落到下方跳转 */ }
  location.replace('./login.html?reason=auth');
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  try {
    await api('/api/admin/logout', { method: 'POST' });
  } finally {
    location.replace('./login.html?reason=logout');
  }
});

boot();
</script>
</body>
</html>
